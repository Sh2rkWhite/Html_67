<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="cards.css" />
</head>
<body>
    <h1>Картки та макети</h1>
    <h2>Картка</h2>
    <p>
        Картка (card) - один з центральних термінів
        веб-дизайну. Широко вживається для представлення
        різноманітних сутностей: товарів, фільмів, ігор тощо.
    </p>
    <div class="card">
        <div class="card-image"></div>
        <div class="card-headline">Headline</div>
        <div class="card-subhead">Subhead</div>
        <div class="card-text">
            Самий кращий вибір тільки для вас. 
            Поспішайте придбати
        </div>
        <div class="card-footer">
            <button class="card-button"><i class="bi bi-basket"></i></button>
            
        </div>
    </div>
</body>
</html>
