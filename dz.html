<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Нові елементи форми</title>
    <link rel="stylesheet" href="dz.css">
</head>
<body>

    <form>
        <table>
            <tr>
                <td>Пароль</td>
                <td><input type="password" /></td>
            </tr>
            <tr>
                <td>Число</td>
                <td><input type="number" /></td>
            </tr>
            <tr>
                <td>Телефон</td>
                <td><input type="tel" /></td>
            </tr>
            <tr>
                <td>Сайت (URL)</td>
                <td><input type="url" /></td>
            </tr>
            <tr>
                <td>Пошук</td>
                <td><input type="search" /></td>
            </tr>
            <tr>
                <td>Повзунок</td>
                <td><input type="range" /></td>
            </tr>
            <tr>
                <td>Кнопка відправки</td>
                <td><input type="submit" value="Відправити" /></td>
            </tr>
        </table>
    </form>

</body>
</html>
